version: '2.0'
AtcInventoryNEAll:
  workflow_meta:
    author: Nokia R&D
    version: "1.0.0"
    deprecated: false
  type: direct
   
  tags:
   - AutomationTestCase(ATC),RESTCONF,GET,JS,HTML
  output:
    result: <% $.html %>
  
  tasks:              
    # NB API call 
    getNeInfo:
      action: nsp.https
      input: 
        url: https://<% locate_nsp() %>:8545/restconf/data/nsp-equipment:network/network-element?depth=2
        method: GET
      publish:
        # only the parameters needed to build the table are selected
        log: <% task().result %>
        testdata: 
          - Create NE inventory list using a RESTCONF API call, be aware that Geo Location in Google Maps only works if the coordinates are configured in the NE
          - url= <% task().result.url %>
          - status= <% task().result.status %> 
          - elapsed= <% task().result.elapsed %> s  
          - <% task().result.content["nsp-equipment:network-element"].select([$.name,$.get("ip-address"),$.get("ne-id"),$.type,$.product,$.version,$.get("managed-state"),$.get("communication-state"),$.get("oper-state"),$.get("resync-state"),$.location,$.latitude,$.longitude]) %>     
      on-complete:
        - createHTMLBegin
        
    # json data returned from API call is formatted in an HTML table using javascript
    createHTMLBegin:   
      action: std.js
      input:
        context: <% $.testdata %>
        script: |
          var row =$[4];
          var header=$;
          var report="<!DOCTYPE html><html><style>table, th, td {  border: 1px solid black; border-collapse: collapse;} </style><body>"
          // Create header table          
          report=report+"<table><tr><th>"+header[0]+"<tr><td>"+header[1]+"<tr><td>"+header[2]+"<tr><td>"+header[3]+"</tr></table><p>"
          // Create data table          
          report=report+"<table><tr><th>Name<th>MNG IP<th>NE ID<th>Type<th>Product<th>Version<th>Mng State<th>Comm. St<th>Oper St<th>Resync St<th>Location</th></tr>"     
          for(var i  = 0; i < row.length; i++) {
             report=report+"<tr><td>"+row[i][0]+"<td>"+row[i][1]+"<td>"+row[i][2]+"<td>"+row[i][3]+"<td>"+row[i][4]+"<td>"+row[i][5]+"<td>"+row[i][6]+"<td>"+row[i][7]+"<td>"+row[i][8]+"<td>"+row[i][9]+"</td>";
             // The location the latitude and longitude are used to build a link towards Google Maps, be aware that this only works if these values are correctly configured in the NE
             report=report+"<td><a target=\"_blank\"   href=\"https://www.google.com/maps/search/?api=1&query="+row[i][11]+","+row[i][12]+"\" >"+row[i][10]+"</td></tr>";          
          }
          //report=report+"</table></body></html>"
          report=report+"</table>"
          return report;
      publish:
        #html: <% task().result %> 
        HTMLbegin: <% task().result %>
      on-complete:
        - createHTMLstream
    
    createHTMLstream:
      # Encoding the HTML page into a downloadable HTML stream
      action: std.noop
      publish:
        HTMLstream: <% url_encode($.HTMLbegin) %>         
      on-complete:
        - displayHTMLtable       
        
    displayHTMLtable:    
      # Build the complete HTML Report including the downloadable link   
      action: std.noop
      publish:
        html: |
          {{ _.HTMLbegin }}
           <p>Download NE List:  <a href="data:application/octet-stream;charset=utf-8,{{ _.HTMLstream }}</body></html>  " download="AtcInventoryNEAll.html" style="color:blue;">AtcInventoryNEAll.html</a>               
           </body></html>   
            
   